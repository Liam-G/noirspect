name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --release -- --version
      # The examples double as a smoke test of the exit codes.
      - run: cargo run --release -- lint --program-dir examples/fixed
      - run: |
          set +e
          cargo run --release -- lint --program-dir examples/vulnerable
          test $? -eq 2
