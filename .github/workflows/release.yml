name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="noirspect-$TAG-$TARGET"
          tar -czf "$name.tar.gz" -C target/release noirspect
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: noirspect-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The changelog section of this version, without its heading.
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "noirspect $TAG" --notes-file notes.md

  action:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run the action on the vulnerable example
        id: vulnerable
        uses: ./
        with:
          version: ${{ github.ref_name }}
          program-dir: examples/vulnerable
          upload-sarif: "false"
          fail-on-findings: "false"
      - name: Run the action on the fixed example
        id: fixed
        uses: ./
        with:
          version: ${{ github.ref_name }}
          program-dir: examples/fixed
          sarif-file: fixed.sarif
          upload-sarif: "false"
      - name: Check exit codes
        env:
          VULNERABLE: ${{ steps.vulnerable.outputs.exit-code }}
          FIXED: ${{ steps.fixed.outputs.exit-code }}
        run: |
          test "$VULNERABLE" = 2
          test "$FIXED" = 0
          grep -q '"ruleId": "NUC-002"' noirspect.sarif
