name: noirspect
description: Find under-constrained values in Noir circuits and report them to GitHub code scanning.
author: Liam Giannini, Webcracy.ch
branding:
  icon: shield
  color: purple

inputs:
  program-dir:
    description: Directory containing Nargo.toml.
    default: "."
  args:
    description: Extra arguments for `noirspect lint`, such as `--workspace` or `--baseline noirspect-baseline.json`.
    default: ""
  version:
    description: noirspect release tag to install.
    default: v0.2.1
  sarif-file:
    description: Where to write the SARIF report.
    default: noirspect.sarif
  upload-sarif:
    description: "Upload the report to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  fail-on-findings:
    description: Fail the job when noirspect reports findings.
    default: "true"

outputs:
  exit-code:
    description: "noirspect's exit code: 0 clean, 2 findings, 1 error."
    value: ${{ steps.lint.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Restore noirspect
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.noirspect/bin
        key: noirspect-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install noirspect
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) target= ;;
        esac
        mkdir -p "$HOME/.noirspect/bin"
        archive="noirspect-$VERSION-$target.tar.gz"
        base="https://github.com/Liam-G/noirspect/releases/download/$VERSION"
        if [ -n "$target" ] && curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive" \
            && curl -fsSL -o "$RUNNER_TEMP/$archive.sha256" "$base/$archive.sha256"; then
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$archive.sha256")
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.noirspect/bin"
        else
          echo "No prebuilt binary for $RUNNER_OS-$RUNNER_ARCH; building from source."
          cargo install --locked --git https://github.com/Liam-G/noirspect --tag "$VERSION" --root "$HOME/.noirspect" noirspect
        fi

    - name: Add noirspect to PATH
      shell: bash
      run: echo "$HOME/.noirspect/bin" >> "$GITHUB_PATH"

    - name: Run noirspect
      id: lint
      shell: bash
      env:
        PROGRAM_DIR: ${{ inputs.program-dir }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set +e
        # shellcheck disable=SC2086 # EXTRA_ARGS is a list of flags
        noirspect lint --program-dir "$PROGRAM_DIR" --format sarif --output "$SARIF_FILE" $EXTRA_ARGS
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 1 ]; then exit 1; fi
        exit 0

    - name: Upload to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: noirspect

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.lint.outputs.exit-code == '2'
      shell: bash
      env:
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        echo "::error::noirspect reported findings; see the code scanning alerts or ${SARIF_FILE}"
        exit 2
